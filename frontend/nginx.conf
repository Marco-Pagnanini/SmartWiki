server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy to the backend: no CORS needed inside Docker
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Agent answers can take tens of seconds
        proxy_read_timeout 180s;
        # Uploaded attachments (nginx default is 1 MB)
        client_max_body_size 10m;
    }

    # Files generated by Vite: the name contains a hash that changes on every build, so they
    # can be cached for a long time; a missing file (old hash) gets a 404, not index.html,
    # otherwise the browser would receive HTML instead of CSS
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Fall back to index.html for frontend routes; never cached, so after every
    # build the browser picks up the new CSS and JS file names right away
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
